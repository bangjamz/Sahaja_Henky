<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center">
<div class="w-full max-w-md bg-surface min-h-screen shadow-sm flex flex-col relative overflow-hidden">
<!-- Header / Progress Area -->
<header class="pt-8 pb-4 px-margin-mobile flex flex-col gap-4 z-10 relative bg-surface">
<!-- Top App Bar equivalent (Custom for transactional) -->
<div class="flex items-center justify-between w-full">
<!-- Disabled Back Button -->
<button aria-label="Kembali" class="p-2 -ml-2 text-outline-variant opacity-50 cursor-not-allowed" disabled="">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-subtitle-lg text-subtitle-lg text-on-surface">Pretest</h1>
<!-- Spacer for balance -->
<div class="w-10"></div>
</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-2 mt-4">
<div class="flex justify-between items-end">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Soal 4 dari 27</span>
<span class="font-label-md text-label-md text-primary font-bold">15%</span>
</div>
<!-- Progress track -->
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden">
<!-- Progress fill -->
<div class="h-full bg-primary rounded-full" style="width: 15%;"></div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-margin-mobile pb-margin-mobile relative z-10 pt-4">
<!-- Question Card (Glassmorphism/Soft aesthetic) -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-[0px_4px_20px_rgba(18,29,38,0.05)] border border-surface-variant/50 mb-8 mt-2 relative overflow-hidden">
<!-- Subtle decorative blob inside card -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/5 rounded-full blur-2xl"></div>
<div class="relative z-10">
<div class="flex items-start gap-3 mb-4">
<div class="bg-primary-container/20 p-2 rounded-lg text-primary">
<span class="material-symbols-outlined text-[24px]">help</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface leading-tight mt-1">
                            Seseorang bisa terkena infeksi menular seksual walaupun tidak terlihat sakit.
                        </h2>
</div>
</div>
</div>
<!-- Answer Options -->
<div class="flex flex-col gap-md mt-auto mb-10 w-full">
<!-- Option 1: Benar -->
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.98] transition-all duration-200 rounded-xl p-md flex items-center justify-between border border-outline-variant/30 shadow-[0px_2px_8px_rgba(18,29,38,0.02)] group">
<div class="flex items-center gap-md">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center group-focus:border-primary group-active:border-primary transition-colors">
<!-- Inner dot for selected state (hidden by default) -->
</div>
<span class="font-subtitle-lg text-subtitle-lg text-on-surface">Benar</span>
</div>
</button>
<!-- Option 2: Salah -->
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.98] transition-all duration-200 rounded-xl p-md flex items-center justify-between border border-outline-variant/30 shadow-[0px_2px_8px_rgba(18,29,38,0.02)] group">
<div class="flex items-center gap-md">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center group-focus:border-primary group-active:border-primary transition-colors">
</div>
<span class="font-subtitle-lg text-subtitle-lg text-on-surface">Salah</span>
</div>
</button>
<!-- Option 3: Tidak Tahu -->
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.98] transition-all duration-200 rounded-xl p-md flex items-center justify-between border border-outline-variant/30 shadow-[0px_2px_8px_rgba(18,29,38,0.02)] group">
<div class="flex items-center gap-md">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center group-focus:border-primary group-active:border-primary transition-colors">
</div>
<span class="font-subtitle-lg text-subtitle-lg text-on-surface-variant">Tidak Tahu</span>
</div>
</button>
</div>
<!-- Footer / Action Area (Hidden initially, shown when option selected) -->
<!-- In this static view, we show it disabled to imply the user needs to select an option first -->
<div class="mt-auto pb-4">
<button class="w-full bg-surface-variant text-outline opacity-70 cursor-not-allowed rounded-full py-4 font-subtitle-lg text-subtitle-lg flex justify-center items-center gap-2 transition-all">
                    Lanjut
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</main>
<!-- Ambient background elements for soft aesthetic -->
<div class="absolute bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-surface-container-highest/30 to-transparent pointer-events-none z-0"></div>
</div>
</body></html>
