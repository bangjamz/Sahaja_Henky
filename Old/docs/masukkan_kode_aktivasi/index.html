<script>
        // Auto-advance inputs for better UX
        const inputs = document.querySelectorAll('#code-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                if(this.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if(e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Demo error state toggler
        function showError() {
            const errorMsg = document.getElementById('error-message');
            const codeInputs = document.querySelectorAll('#code-inputs input');
            
            errorMsg.classList.remove('opacity-0');
            
            codeInputs.forEach(input => {
                input.classList.remove('border-outline-variant', 'focus:border-primary');
                input.classList.add('border-error', 'text-error', 'focus:border-error', 'focus:ring-error/20');
            });

            // Shake animation using standard CSS translation
            const container = document.getElementById('code-inputs');
            container.style.transform = 'translateX(-8px)';
            setTimeout(() => container.style.transform = 'translateX(8px)', 100);
            setTimeout(() => container.style.transform = 'translateX(-8px)', 200);
            setTimeout(() => container.style.transform = 'translateX(8px)', 300);
            setTimeout(() => container.style.transform = 'translateX(0)', 400);
        }
    </script>
