<script>
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('.likert-option');
            const submitBtn = document.getElementById('submit-btn');
            const overlay = document.getElementById('success-overlay');
            const successCard = document.getElementById('success-card');
            const closeOverlayBtn = document.getElementById('close-overlay');
            let selectedValue = null;

            options.forEach(option => {
                option.addEventListener('click', function() {
                    // Reset all
                    options.forEach(opt => {
                        opt.classList.remove('border-primary', 'bg-primary-container/20');
                        opt.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                        
                        const dot = opt.querySelector('.indicator-dot');
                        dot.classList.remove('scale-100');
                        dot.classList.add('scale-0');
                        
                        const radio = opt.querySelector('.radio-indicator');
                        radio.classList.remove('border-primary');
                        radio.classList.add('border-outline-variant');
                        
                        const emojiBg = opt.querySelector('.emoji-container');
                        emojiBg.classList.remove('bg-surface-container-lowest');
                        emojiBg.classList.add('bg-surface-variant');
                    });

                    // Set active
                    this.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                    this.classList.add('border-primary', 'bg-primary-container/20');
                    
                    const dot = this.querySelector('.indicator-dot');
                    dot.classList.remove('scale-0');
                    dot.classList.add('scale-100');
                    
                    const radio = this.querySelector('.radio-indicator');
                    radio.classList.remove('border-outline-variant');
                    radio.classList.add('border-primary');
                    
                    const emojiBg = this.querySelector('.emoji-container');
                    emojiBg.classList.remove('bg-surface-variant');
                    emojiBg.classList.add('bg-surface-container-lowest');

                    selectedValue = this.getAttribute('data-value');
                    
                    // Enable button
                    submitBtn.removeAttribute('disabled');
                    submitBtn.classList.remove('disabled:opacity-50', 'disabled:bg-surface-variant');
                });
            });

            submitBtn.addEventListener('click', () => {
                if(selectedValue) {
                    // Show overlay
                    overlay.classList.remove('hidden');
                    // Small delay to allow display block to apply before animating opacity/transform
                    setTimeout(() => {
                        overlay.classList.remove('opacity-0');
                        successCard.classList.remove('scale-90', 'opacity-0');
                        successCard.classList.add('scale-100', 'opacity-100');
                    }, 50);
                }
            });
            
            closeOverlayBtn.addEventListener('click', () => {
                overlay.classList.add('opacity-0');
                successCard.classList.remove('scale-100', 'opacity-100');
                successCard.classList.add('scale-90', 'opacity-0');
                
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 300);
            });
        });
    </script>
